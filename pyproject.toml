[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scidoc-ocr"
version = "1.0.0"
description = "Scientific Document OCR & Translation Desktop Application with LaTeX, Math recognition and AI routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pymupdf>=1.23.0",
    "sympy>=1.12",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
scidoc-ocr = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
